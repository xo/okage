# The Rust oracle of okage (D22). It links tiny-skia 0.12.0, the base version
# of the port (D12), with its scalar code (D16), and it renders the scenes that
# the Go tests of the test module write as JSON.
[package]
name = "okage-oracle"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
tiny-skia = { version = "=0.12.0", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = false
